[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rclpy-shim-mtm-pro"
version = "0.1.0"
description = "Import-only stand-in for the ROS2 `rclpy` python package (MTM-Pro standalone docker image)."

[tool.setuptools.packages.find]
where = ["."]
include = ["rclpy*"]
