# ....Hydra configuration................
hydra:

  # (Priority) ToDo: validate (ref task RLRP-456)
  # verbose: true
  job_logging:
    level: DEBUG

  callbacks:
    R2S2R_callback:
      _target_: tools.hydra_apps_tools.r2s2r_apps_utils.R2S2RConsoleHydraCallback
