
# ====Model type: Multistep===========

_target_: tools.multistep_tools.models.WeightedMultiStepDualHeadMLP
description: "Weighted multistep dual head PME"

ensemble_size: 5 # ★★★ Require ensemble_size > 1
deterministic: false # ★★★
propagation_method: expectation # ★★★
learn_logvar_bounds: true # ★★★

mae_loss: true
distribution_name: laplace # ★

enable_auto_loss_weighting: true
ss_composite_loss_weight: 1.0
ms_composite_loss_weight: 1.0
enable_multistep_head: true # ★★★

# ....Multistep....................................
dual_head_shared_input_layer: true # ★


# temporal_weights:
#   - 0.99
#   - 0.9
#   - 0.85
#   - 0.8
#   - 0.7
temporal_weights: 0.9
# `ms_temporal_weighting_mode` (RLRP-769): HOW the temporal discount w_j=gamma^j enters the
# per-step NLL + the matching horizon scale. Options:
#   log-shift    -> nll_j + log w_j (legacy, former default; gamma gradient-inert, magnitude ~ horizon_len)
#   tempered     -> w_j*nll_j, sum_j w_j=1 (convex combo; gamma effective; horizon-scale invariant)
#   discounted-sum -> gamma^j*nll_j (raw EMA, w_0=1; gamma effective; magnitude ~ 1/(1-gamma)) [DEFAULT]
#   joint        -> sum_j nll_j (exact independent joint NLL; undiscounted)
#   uniform-mean -> (1/horizon_len) sum_j nll_j (discount ablated; scale fixed)
ms_temporal_weighting_mode: discounted-sum
# Options: true,false,null
ms_probabilities_reduction: independent

# obs_feature_weights:
#   - 1.0
#   - 1.0
#   - 1.0
# act_feature_weights:
#   - 1.0
#   - 1.0

history_len: 20
horizon_len: 10

singlestep_obs_len: ??? # quickhack
singlestep_act_len: ??? # quickhack

# Per-region layer-bloc selector (RLRP-768; superset of `residual_form`).
#   null (default) -> encoder/hidden -> residual_v2; every other region
#     (decoder, ms_head, ss_head, mixture, projection, probabilistic_head) -> dense.
#   Override per region, e.g. `layer_bloc: {encoder: {type: gated_mlp, layer_norm: true}}`.
#   type in {residual_v2, residual_legacy, dense, gated_mlp}; gated_mlp + layer_norm
#   are legal ONLY in encoder/hidden. `residual_form` (if present) stays a working alias.
layer_bloc:
  encoder:
    type: residual_v2
    layer_norm: false
    dropout: null
  ms_head:
    type: dense

num_layers: 4
hid_size: 444
ms_head_num_layers: 1
ms_head_dropout: 0.25
ss_head_num_layers: 4

activation_fn_cfg:
  # _target_: torch.nn.ReLU
  # _target_: torch.nn.GELU  # ★ recommended: smooth, no hard saturation, good gradient flow
  # _target_: torch.nn.LeakyReLU  # viable alternative: no saturation, linear for negatives
  # _target_: torch.nn.SiLU  # Also known as the swish function
  _target_: torch.nn.Mish # Better precision than ReLU and Swish, better generalization

# Activation fct ref
# - https://pytorch.org/docs/stable/nn.html#non-linear-activations-weighted-sum-nonlinearity
# - (2021) https://www.v7labs.com/blog/neural-networks-activation-functions


