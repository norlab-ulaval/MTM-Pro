# ... Train-Time Domain Randomization ..........
# Train-time domain randomization top layer (OFF by default).
# Introduced by task RLRP-707 of the Training-Pipeline Domain Randomization `.junie` plan
# (feature_training_pipeline_domain_randomization_plan_20260610.md).
train_time_domain_randomization:
  enable: false               # ★ disabled by default for all parent and child models
  noise_kind: gaussian        # Options: gaussian, uniform, time_correlated, reverse_time_correlated, time_correlated_hi_to_ho, reverse_tc_in_tc_out
  default_scale: 0.0          # Fallback when per_feature_scale is None
  per_feature_scale: null     # List of per-feature noise magnitude
  correlation: 0.0            # AR(1) coeff in [0, 1) for time_correlated kinds: 0.0 => i.i.d. noise (no
                              # temporal correlation); 0.5 => moderate correlation between consecutive
                              # timesteps; ->1.0 => strongly persistent (noise nearly constant along time).
  randomize_target: false     # Enable DR for model input and target (REQUIRED true for time_correlated_hi_to_ho, reverse_tc_in_tc_out)
  scheduler:
    kind: constant            # One of constant, linear, ease_in_out_ramp or cyclic_cosine.
    start_scale: 1.0          # Multiplier value at (or before the end of) the warmup phase.
    end_scale: 1.0            # ramp kinds: target value; cyclic_cosine: envelope target (grows/shrinks wave magnitude).
    warmup_epochs: 0          # Number of initial epochs held at start_scale.
    total_epochs: 0           # ramp kinds: epoch index at which end_scale is reached (clamped after).
    cycle_length: 0           # cyclic_cosine: wave length (period) in epochs.
    cycle_length_growth: 0.0    # cyclic_cosine: epochs added to the period per elapsed epoch; widens (>0) / narrows (<0), independent of total_epochs.
    trough_growth: 0.0          # cyclic_cosine: lifts the per-cycle lowest point (0.0 => trough returns to 0; 0.25 => +25% of envelope per cycle).


# ====General======================================
dropout: 0.0

model_use_double_precision: false # ⚠️
# RLRP-736: per-feature geometry loss weight (0.0 -> OFF / bit-exact legacy loss).
# Set > 0 to enable the orientation-aware geodesic term for envs whose feature
# handler defines a quaternion group (robotic-3D UGV/UAV); no effect for the
# neutral math-env handler.
feature_geometry:
  loss_weight: 0.0
  loss_objective: null # Options: geodesic (default), chordal, null (disable)
  # RLRP-751: false (default) -> STATIC weighting (scaled by loss_weight, legacy
  # behaviour); true -> route the SS/MS/CP feature-geometry channels through the
  # composite uncertainty auto-weighting (Kendall 2018), with loss_weight as the
  # pre-multiplier. ONE key controls all three channels; gracefully degrades to
  # STATIC on families without an (enabled) composite auto-weighting module.
  auto_weighting: false

device: ${device}
in_size: ???
out_size: ???
