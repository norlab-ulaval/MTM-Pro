# ====Training=====================================
training_common:

  # NOTE (RLRP-824 consolidation): the process-global torch backend knobs (TF32 via
  # `cuda_high_precision_float32`, `cudnn_benchmark`) live ONLY under the top-level `torch_backend`
  # group (`global_config.yaml`) and are applied once by `R2S2RPipelineHydraApp.setup()`. The
  # short-lived `training_common.cuda_backend` duplicate was removed (it re-wrote the same
  # `torch.backends` flags at trainer setup and silently reverted `torch_backend.cudnn_benchmark`).
  optimizer:
    use_adam: true
    # A8 (RLRP-783 follow-up): opt-in fused (CUDA) / capturable Adam that removes the
    # per-parameter `torch.optim.optimizer._get_value(step).item()` device->host sync
    # (`perf_RLRP-783_mtm_pro_models_code_optimization_plan_20260827.md`). Read via
    # `OmegaConf.select(..., default=False)` so ABSENT/`false` => legacy single-tensor Adam.
    # NOTE fused Adam is NOT bit-exact vs the legacy kernel and is CUDA-only (falls back to
    # legacy off-CUDA); `adam_capturable` is the CUDA-family fallback. Sourced from the selected
    # pipeline group via `${oc.select:pipeline.optimizer.adam_fused,false}`: the
    # multirun/HPO/deploy/pipeline configs opt in (`pipeline.optimizer.adam_fused: true`); any
    # pipeline that does not declare the key => `false` (legacy single-tensor Adam, unchanged).
    adam_fused: ${oc.select:pipeline.optimizer.adam_fused,false}
    # adam_capturable: false
    # NAdam:
    #   # momentum_decay: 0.91
    #   # momentum_decay: 0.1
    #   # momentum_decay: 0.075
    #   momentum_decay: 0.05 # ★
    #   # momentum_decay: 0.01
    #   # momentum_decay: 0.004 # default
    #   # momentum_decay: 0.001
    #   decoupled_weight_decay: true # default: false. Set to True to get NAdamW
    # AdamW:
    #   amsgrad: false # ★
    # SGD:
    #  momentum: 0.1
    #  nesterov: true # Require dampening=0
    #  dampening: 0.0
  trainer_lr_schedule: # ToDo: experiment
    # warmup:
    #   steps: 10 # Maintain initial model_lr for <step> warmup epochs (0 to disable)
    #   factor: 1.0 # Default: 1.0
    cosine_annealing_lr:
      T_max: null # T_max will be set to "num_epochs_train_model"
      # T_max: 400
      # T_max: 20
      # eta_min: 1e-8
      eta_min: 1e-30
      # eta_min: 1e-10
      # eta_min: 0 # Default: 0
    exponential_lr:
      # gamma: 0.5
      # gamma: 0.7
      # gamma: 0.8
      # gamma: 0.88 # ★★★
      # gamma: 0.91
      # gamma: 0.93
      # gamma: 0.95
      # gamma: 0.97
      # gamma: 0.98 # ★
      gamma: 0.99 # ★★★
      # RLRP-770 (option 3): opt-in auto-`gamma`. When `end_fraction` (0, 1) is set, `gamma` is
      # IGNORED and derived per UDER pass as `end_fraction ** (1/(pass_num_epochs-1))` so the LR
      # always lands on `end_fraction` of the pass restart height (removes the fixed-`gamma`
      # frozen tail on long passes). Under Law-U the pass budget is auto-sized (RLRP-727 B2).
      # end_fraction: 0.05
    # lambda_lr:
      # _target_: functools.partial
      # func:
      #   _target_: builtins.pow
      # _args_: [0.95]  # Creates: lambda epoch: 0.95 ** epoch
    # cyclic_lr:
    #   base_lr: ${training_common.model_lr}
    #   max_lr: 1e-3
    #   step_size_up: 3
    #   mode: "exp_range"
    #   gamma: 0.8
  # model_lr: 1.25e-3 # Watchout for gradient collapse!
  # model_lr: 1.125e-3
  # model_lr: 1.05e-3
  # model_lr: 1e-3
  model_lr: 5e-4 # ★
  # model_lr: 2.5e-4
  # model_lr: 1e-4 # Default 1e-4 ★ <--
  # model_lr: 5e-5
  # model_lr: 1e-5
  # model_lr: 1e-6
  model_wd: 1e-3
  # model_wd: 1e-4 # Quadrocopter paper
  # model_wd: 5e-5 # Default 5e-5
  # model_wd: 1e-5
  # model_wd: 1e-6
  # model_wd: 1e-9
  # model_wd: 1e-15
  # model_wd: 0 # Disable
  # patience: null # Early stopping Options: int or null ⚠️
  patience: 100 # Early stopping Options: int or null (need to be greater than num_epochs_train_model/uder_num_epochs otherwise any uder_num_epochs can be cut short) ⚠️
  improvement_threshold: 0.00000001 # Affect model saving & early stopping (Default 0.01)

ss_training: ${training_common}
ms_training: ${training_common}


# ====Single-Step model============================
one_dim_transition_model:
  _target_: tools.mbrl_lib_tools.models.one_dim_tr_model_v2.OneDTransitionRewardModelV2
  normalize: true # <--
  # Options: standard, standard_symmetric, standard_symmetric_innovation, winsorized, quantile
  # Note (RLRP-761 S5.2): `standard` uses the single concatenated facade and
  #   DROPS the resolved per-feature contract. With a `unit_norm` block declared
  #   (the `attitude.*` quaternion / the `gravity.*` direction) it is REFUSED,
  #   since the block would be z-scored off the unit sphere. Opt back into the
  #   historical silent behaviour with `+one_dim_transition_model.allow_contract_drop=true`.
  normalizer_type: standard_symmetric
  # normalizer_type: winsorized
  # normalizer_kwargs:
  #   # ....RLRP-761 S4 -- `standard_symmetric_innovation` only.......
  #   # innovation_scale_mode: one_step_delta
  #   #   # one_step_delta -> s = std(x[t+1] - x[t])                 (default)
  #   #   # noise_floor    -> s = 1.4826 * MAD(2nd diff) / sqrt(6)   the IRREDUCIBLE
  #   #   #                   high-frequency floor; a rare adverse excursion stays a
  #   #   #                   large multiple of it instead of raising its own bar.
  #   #   # explicit       -> use the `innovation_scale` vector below.
  #   # innovation_scale_floor: 1e-6  # absolute lower bound on `s`, keeps the
  #   #                               # transform finite on a constant / quantized dim.
  #   # innovation_scale: null        # (in_size,) vector, REQUIRED by `explicit`.
  #   # NOTE: needs a MULTISTEP model AND sequence structure; without it the
  #   #   innovation is not observable and the type degrades to
  #   #   `standard_symmetric` with a one-shot warning (it does NOT fail silently).
  #   # clip_range: 5.0           # (standard only) Clip z-scored inputs to [-clip, +clip]. Default to null.
  #   #                            # NeuroBem ang-vel outliers reach ±10–15 σ → large gradients.
  #   #                            # Without clipping, normalize:true caused ~50× worse MAE
  #   #                            # (RLRP investigation 2026-03-11).
  #   # winsor_percentile: 0.05    # (winsorized only) percentile for winsorization
  #   # soft_clip_iqr_mult: 3.0    # (winsorized only) IQR multiplier for adaptive clip threshold
  #   # soft_clip_iqr_mult: null   # (winsorized only) Set to null to DISABLE the asinh soft-clip
  #   #                            # stage and recover the classic WinsorizedNormalizer behavior
  #   #                            # (pure winsorized z-score, no soft-clipping).
  #   winsor_percentile: ${environment.normalizer.winsor_percentile}
  #   soft_clip_iqr_mult: ${environment.normalizer.soft_clip_iqr_mult}
  #   feature_dim_names: ${environment.normalizer.feature_dim_names}
  #   # n_bins: 1000              # (quantile only) number of quantile bins
  #   # tail_policy: linear       # (quantile only) extrapolation policy for out-of-range values
  normalize_double_precision: true # Optional[bool] null->Auto-detected from model precision
  # target_is_delta: true
  # no_delta_list: [3,4,5,6]
  # learned_rewards: false
  num_elites: null

# ====Feature loss-weight policy (RLRP-761 S7 / S10)=====
# The SINGLE home of the per-feature loss-weight policy: the criterion, the
# semantic and the three bounds. It is deliberately NOT part of `ms_model`:
# this is a training-OBJECTIVE policy, resolved from the dataset at the
# training-start seam long after the model exists, and the model only ever
# receives the already-resolved numeric vectors. Separation of concerns.
#
# Budget share of a feature = `w_d * sigma_delta_TARGET_d ** 2`, renormalized.
#
# MIGRATION: `ms_model.obs_feature_weights` / `act_feature_weights` /
#   `feature_weight_mode` / `feature_weight_max_ratio` are DEPRECATED aliases of
#   the keys below; they still work and emit a DeprecationWarning naming the
#   replacement.
feature_loss_weights:
  # ....The criterion..............................................................
  # A named criterion, a scalar, or an explicit per-dim list.
  #   predictability   -> w ~ (sigma_delta / sigma_noise_floor)**2. RECOMMENDED:
  #                       de-emphasises NOMINAL vibration while keeping the rare
  #                       adverse excursions fully salient.
  #   state_equivalent -> w ~ sigma_state**2. The raw-space CONTROL: it makes a
  #                       symmetric target reproduce the per-feature budget the
  #                       raw-target `standard` path implicitly uses.
  #   raw_equivalent   -> w ~ sigma_delta**2, i.e. innovation energy. NOTE
  #                       (RLRP-761 S8.4f) this is NOT the raw-space control it was
  #                       once documented to be -- that needs sigma_state**2.
  #   uniform          -> the scalar 1.0 (explicit opt-out, weighting path OFF).
  # obs_feature_weights: predictability
  # An UNSET act block inherits the obs criterion (S7.3): the two are concatenated
  # and normalized jointly, so leaving it at 1.0 is NOT neutral. `uniform` opts out.
  # act_feature_weights: null
  # ....The semantic...............................................................
  # `multiplicative` -> `w_d * NLL_d`, which actually re-allocates the gradient.
  # `tempered`       -> `NLL_d + log w_d`, an ADDITIVE CONSTANT on an NLL, hence
  #                     GRADIENT-INERT (blocker B1). Pairing it with a named
  #                     criterion is REFUSED, since it yields a null result that
  #                     looks like a measurement.
  # feature_weight_mode: multiplicative
  # ....The three bounds -- three DIFFERENT quantities.............................
  # Lower bound on a resolved weight, in units of the MEAN weight. The named
  # criteria are quadratic in a measured scale, so without a floor a low-innovation
  # channel collapses by ~2 orders of magnitude. On the reference UGV run this
  # left `angular_vels.x/y` at w=0.04/0.05 -- i.e. the adverse-event channels
  # (traction loss, weight transfer) effectively unsupervised. `0.0` disables it.
  feature_weight_min: 0.25 # <--
  # Target weight of the `dt` (delta-timestamp) dim. RLRP-761 S12.3 (2026-08-03)
  # withdrew the pre-S12 `0.0`: the MS forecast/mixture self-feed predicts the
  # commands AND `dt` and re-injects them to advance the clock over the horizon,
  # so `dt` is a genuine FORECAST target at training time (even though the deploy
  # head emits obs only). Under S12 the act block is innovation-scaled like the
  # obs block, so `dt` is an ordinary target governed by `predictability` and
  # bounded by the joint budget cap -- no dedicated override is needed. Left at
  # the inert default `1.0` (deprecated by-kind opt-out); set `0.0` to reproduce
  # the pre-S12 deploy-only-obs baseline for a controlled A/B.
  dt_target_weight: 1.0 # <--
  # Maximum share of the composed target budget a single feature may hold. This
  # is the bound that MATTERS, and the three bounds are NOT interchangeable:
  # `feature_weight_min` bounds the WEIGHT, `max_weight_ratio` the weight RATIO,
  # and only this one bounds the realized BUDGET -- which is quadratic in the
  # normalized one-step innovation, hence a 94x weight spread produced a ~200x
  # budget spread, and even after `feature_weight_min` one feature still held
  # 59 %. Enforced by water-filling across the obs AND act blocks jointly.
  # `1.0` disables it.
  max_target_share: 0.40 # <--
  # Upper bound on the RATIO of the resolved weights (`max_d w_d / min_d w_d`),
  # applied as a symmetric log-space squash BEFORE the model's own sum
  # normalization (only ratios survive it, so an absolute clip is meaningless).
  # `null` -> framework default.
  max_weight_ratio: null

