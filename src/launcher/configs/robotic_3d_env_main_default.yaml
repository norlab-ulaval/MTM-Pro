    # gamma: 1.05 # For 200->500 in 20 epochs
    # gamma: 1.12 # For 32->264 in 20 epochs
    # gamma: 1.19 # For 32->1000 in 20 epochs
    # gamma: 1.09 # For 200->400 in 10 epochs
    # gamma: 1.26 # For 200->500 in 5 epochs
    # gamma: 1.05 # For 200->500 in 20 epochs or 200->600
    gamma: 1.09 # For 300->600 in 10 epochs
    # gamma: 1.16 # For 300->1000 in 10 epochs
    # gamma: 1.26 # For 200->500 in 5 epochs
    # limit: 512
    limit: 200
    # limit: 1600
