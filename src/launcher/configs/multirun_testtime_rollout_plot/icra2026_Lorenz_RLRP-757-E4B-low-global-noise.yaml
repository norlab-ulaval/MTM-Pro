#
# Hydra launch command with experiment cfg override:
#   $ python3 launcher/multirun_testtime_rollout_plot.py multirun_testtime_rollout_plot@_global_=icra2026_Lorenz_RLRP-757-E4B-low-global-noise
#

# ====Experiment===================================
algorithm:
  name: 'ICRA2026'

overrides:
  experiment: "RLRP-757-Lorenz-E4B-multirun-test-time-plot"

latex_includegraphics:
  save_path: artifact/ICRA2026/latex_includegraphics/${overrides.experiment}
  file_name: rlrp757_lorenz_E4B_20to10

# env_name: "Lorenz v6, 5x initial conditions"
env_name: "Lorenz attractor (V6, 5x init conditions, low global noise)"

general_coment: "Goal: Lorenz preliminary assessment.
"

simulator_config: lorenz_v6_5XinitC_low_global_noise

show:
  # When true, render a secondary x-axis on top of the General /
  # Final-General / per-category / per-trajectory plots displaying
  # timestamps in the unit declared by the active simulator config
  # (``environment.data.original_timestamps_unit``). The primary x-axis
  # remains in timesteps. Conversion uses
  # ``environment.data.target_frame_rate`` (Hz) to map step -> seconds,
  # then to the target unit. Default: false.
  show_timestamp_xaxis: true

  # target_is_ood: true
  target_is_ood: false
  average_across_trajectories: false # (false) show inter-trial variation, (true) shows inter-trajectory-pattern variation (caution mean of mean).
  summary_table: false

  # When true, render the y-axis (metric scale) in log10 scale on the General
  # plot, per-category plots, and per-trajectory plots. Default: false.
  # y_axis_in_logscale: false
  y_axis_in_logscale: true
  y_axis_in_logscale_min_value: 1e-4
  x_axis_in_logscale: false
  # x_axis_in_logscale: true

  # breakdown: [null|'category'|'trajectory']
  #   null        -> no breakdown plots
  #   'category'  -> per-length-category plots (S/M/L) — previous default
  #   'trajectory'-> per-`trajectory_name` plots (one plot per GT trajectory)
  # breakdown: category
  # breakdown: trajectory
  breakdown: null

  # general_length: [null|'min'|'max'|<int>]
  #   null   -> skip general plot entirely
  #   'min'  -> shortest trajectory length (selects all)
  #   'max'  -> longest trajectory length (typically 1 trajectory)
  #   <int>  -> select trajectories with GT length >= <int>, xlim.right=<int>
  general_length: null
  # general_length: max
  # general_length: 200
  # general_length: 2000
  # general_length: 3600
  # general_length: 8000

  # ... Ground-truth-feed warm-up interval treatment (RLRP-733) ...................
  # During the warm-up interval (timesteps 0 .. ground_truth_feed_warmup_steps)
  # the model is fed ground truth, so its error is artificially near-zero. On a
  # log-scale time axis (`x_axis_in_logscale: true`) these early timesteps get
  # magnified, visually flattening the meaningful compounded-prediction region.
  # This option controls how that interval is treated on EVERY time-axis plot
  # (General, Final-General, per-category, per-trajectory, and the drift-rate
  # plot).
  #
  # ground_truth_feed_warmup.mode: [null|'discard'|'reference_line']
  #   null             -> no treatment (current behavior; omit the block for the same)
  #   'discard'        -> clamp the left x-limit to the warm-up boundary
  #                       (the warm-up region is not shown)
  #   'reference_line' -> keep all data but draw a dashed vertical marker at
  #                       the warm-up boundary (log-scale faithful; the marker
  #                       is drawn in data coordinates)
  #
  # The warm-up step count is ALWAYS auto-derived from each recorded rollout's
  # saved Hydra config (deploy.target_experiment.ground_truth_feed_warmup_steps)
  # — there is no manual override. If the contributing experiments were recorded
  # with different warm-up lengths the pipeline fails fast with an informative
  # error (they cannot be meaningfully compared on a shared axis). A value of 0
  # is a valid warm-up length ("no warm-up") and is honored, not skipped.
  ground_truth_feed_warmup: # <--
    # mode: null
    # mode: reference_line
    mode: discard

  # ... Final general plot (all-trajectory aggregation) ............................
  # Renders an additional plot aggregating EVERY trajectory regardless of length,
  # with a light std band (mean ± 1·std) and a dark SEM band (mean ± 2·SEM).
  # The dark SEM band naturally widens to the right where fewer trajectories
  # contribute. Note: `variation_type` is fixed to `group_mae_std` for this plot.
  generate_final_general_plot:
    render: false # <--
    skip_nan_contaminated_mae: true
    skip_nan_contaminated_std_uncertainty: true

  # ... C-MAE drift-rate plot .....................................................
  # Renders one curve per group of the cumulative MAE divided by
  # (timestep · cumulative GT path length), paired per-rollout with its
  # matching GT trajectory (by `_trajectory_name`).
  #   length_cutoff: [null|<int>]  (minimum-trajectory-length selector, RLRP-734)
  #     null   -> select ALL trajectories; horizon = shortest trajectory length
  #     <int>  -> select trajectories with (trajectory length >= <int>);
  #               horizon = <int> (each retained rollout trimmed to length_cutoff)
  #   train_epochs: [null|<int>|[<int>, ...]|all]  (training-epoch series selector)
  #     null       -> single figure from the deployed (final) model rollouts
  #     <int>      -> single figure from that `epoch_<E>` snapshot's rollouts
  #     [<int>...] -> a SERIES of training epochs -> one figure per epoch, each
  #                   saved file prefixed with `<train_epoch>_epoch_<plot_name>.png`
  #                   and the training epoch added to the in-axes annotation.
  #     all        -> auto-discover EVERY `epoch_<E>` rollout snapshot and render
  #                   one figure per discovered epoch (same file-name prefix and
  #                   annotation as the explicit list case).
  #   generate_diaporama: [true|false]  (slideshow video of the PNG series)
  #     When a SERIES of figures is produced (train_epochs list / `all`), stitch
  #     the ordered per-epoch PNG frames into a slideshow video (`ffmpeg` req.)
  #     saved as `test_time_models_comparaison_drift_rate_diaporama.mp4`.
  #   diaporama_fps: <float>  (frames per second; each frame shown 1/fps sec)
  generate_drift_rate_plot:
    render: true
    # render: false

    # length_cutoff: null # Options: null->trajectories smallest lentgh, int->select all trajectories of length >= to length_cutoff
    # length_cutoff: 2500
    length_cutoff: 4000 # <-- ICRA2026
    # length_cutoff: 6000
    # length_cutoff: 10000
    # `train_epochs` drives the iteration: null (deployed/final model, legacy),
    # a single int, a list of int (a SERIES of training epochs -> one figure
    # per epoch, each file prefixed with `<train_epoch>_epoch_`), or `all` to
    # auto-discover and render every available `epoch_<E>` snapshot.
    train_epochs: null
    # train_epochs: all  # Auto-discover every available training epoch snapshot
    # train_epochs: [100, 500, 1000, 2000]  # Series of training epochs (one figure each)
    # Assemble the produced PNG series into a 1-fps slideshow video (`ffmpeg`).
    generate_diaporama: true  # Options: true->build the .mp4 slideshow, false->skip
    diaporama_fps: 1.0        # Frames per second (each image shown 1/fps seconds)
    # top_ylim: 1e+4
    top_ylim: 1e+2
    # top_ylim: 1e+20
    # bottom_ylim: 1e-2 # For logscale
    # bottom_ylim: 1e-4 # For logscale
    bottom_ylim: 1e-4 # For logscale
    # # top_ylim: 1.5e+2 # For logscale OoD
    # # top_ylim: 1.0e+2 # For logscale InD
    # bottom_ylim: 1e-2 # For logscale InD GT warmup discarded

    # ... Per-train-epoch C-MAE drift-rate plot (RLRP-773 W9) ....................
    # Opt-in NEW companion plot: one point per discovered `epoch_<E>` training
    # snapshot under `<experiment_base>/epoch_checkpoints_rollouts/` (X axis is
    # the TRAINING EPOCH, Y axis is the same C-MAE drift-rate reduced to a
    # per-epoch scalar). Default OFF (`render: false`) => the drift plot above
    # runs UNCHANGED, and this is a strict no-op when no per-epoch rollout tree
    # exists. Every sub-key below is optional; when omitted it inherits from the
    # parent `generate_drift_rate_plot` block (`length_cutoff`, `drift_type`) or
    # the global default (`y_axis_in_logscale`).
    per_train_epoch:
      render: false
      # render: true
      # drift_type: "timesteps"   # inherits parent when omitted; Options: "timesteps", "path_length"
      # `length_cutoff` accepts either a single int (one horizon, legacy), a
      # list of int (a SERIES of horizons -> one figure per horizon, each saved
      # file prefixed with `<length_cutoff>_horizon_<plot_name>.png`), or an
      # INTERVAL mapping `{start: <int>, stop: <int>, step: <int>}` which is
      # expanded to one horizon per `step` over `[start, stop]` (`stop` is
      # INCLUSIVE when it lands on a step boundary). `step` defaults to 1.
      # length_cutoff: 5000       # inherits parent when omitted
      # length_cutoff: 110  # Still in the warmup phase
      # length_cutoff: 210  # Out of warmup phase for 10 step
      # length_cutoff: 300  # Out of warmup phase for 100 step
      # length_cutoff: [200, 210, 250, 300, 400, 800, 1600, 3200, 6400]  # Series of horizons (one figure each)
      # length_cutoff: [200, 210, 250, 300, 400, 800, 1600, 3200, 6400]  # Series of horizons (one figure each)
      length_cutoff: {start: 200, stop: 2500, step: 25}  # Interval -> [200, 300, 400]
      # Assemble the per-horizon PNG series into a 1-fps slideshow video
      # (`ffmpeg` required); inherits the parent value when omitted.
      generate_diaporama: false  # Options: true->build the .mp4 slideshow, false->skip
      diaporama_fps: 4        # Frames per second (each image shown 1/fps seconds)
      # y_axis_in_logscale: false # inherits the global default when omitted
      top_ylim: 1e+3            # For logscale
      bottom_ylim: 1e-4         # For logscale

  generate_training_wall_clock_time_plot:
    # render: true # <--
    render: false
    width_latex: single_column_width
    height_latex: 1.3


  generate_rollout_wall_clock_time_plot:
    render: false


  # .... Variation around the MAE ..........
  # Option: group_mae_std, group_avg_uncertainty, group_avg_epi, group_avg_ale
  variation_type: group_mae_std
  # variation_type: group_avg_uncertainty
  # variation_type: group_avg_ale
  # variation_type: group_avg_epi

  variation_scale: 1 # ★
  # variation_scale: 2
  # variation_scale: 10 # ★ to highlight ours


  # ... Case 1: non-compounding.............
  # cumulative_metric: true
  # compounded_predictions_score: false
  # # top_ylim: 120 # InD
  # top_ylim: 40 # InD
  # # top_ylim: 510000 # OoD
  # # top_ylim: 0.15e+7 # OoD
  # # top_ylim: null

  # ... Case 2: compounding.................
  cumulative_metric: true
  compounded_predictions_score: true # <--
  # compounded_predictions_score: false # <--
  # top_ylim: null
  # top_ylim: 20
  # top_ylim: 0.05 # <--
  # top_ylim: 20.0 # Normal scale y axis
  # top_ylim: 1e+6 # <--
  # top_ylim: 0.25 # Avg drift, compouned pred, OoD
  # top_ylim: 55000 # OoD
  # top_ylim: 100000 # OoD
  # top_ylim: 295000 # InD

  # ... Case 3 .............................
  # cumulative_metric: false
  # compounded_predictions_score: true
  # top_ylim: null

  # ... Case 4 .............................
  # cumulative_metric: false
  # compounded_predictions_score: false
  # top_ylim: null

  # ... figure display .....................
