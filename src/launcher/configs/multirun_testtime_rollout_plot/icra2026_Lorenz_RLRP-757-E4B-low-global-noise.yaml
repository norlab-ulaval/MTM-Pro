    - "M3-bf16-F1000"
    # - "E2E-TCN"
    # - "M3"
    # - "E2E-TCN-F20"
    # - "M3-F20"
    # - "TBM-Det F=5"
    # - "TBM-Det F=20"
    # - "TBM-Prob"

    # ....Our.....................
    - "(ours) D-MTM-Pro-MS+CP"
    - "(ours) D-MTM-Pro-MS+CP-fast-CudaG"
    # - "(ours) D-MTM-Pro-MS"
    - "(ours) D-MTM-Pro-MS-fast-cudaG"
    # - "(ours) D-MTM-Pro-MS+CP+gatedMLP"
    # - "(ours) D-MTM-Pro-MS+SS"
    # # - "(ours) D-MTM-Pro-MS+gatedMLP"
    # - "(ours) P-MTM-Pro-MS+CP"
    # - "(ours) P-MTM-Pro-MS"
    # - "(ours) P-MTM-Pro-MS+SS"
    # # - "(ours) ReP-MTM-Pro-MS"
    # # - "(ours) ReP-MTM-Pro-MS+SS"
    # # - "(ours) ReP-MTM-Pro-MS+CP"

