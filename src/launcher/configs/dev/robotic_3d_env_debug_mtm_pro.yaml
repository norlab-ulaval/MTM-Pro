#
# MTM-Pro family quick dev/debug setup on the robotic 3D env (Particle MTM-Pro
# `ms2ms2ss_ar_temporal_mixture_pme` and the dual-head PME `tw_ms2ss_dh_pme` ancestors). Keys listed
# under `ms_model` are the ones that ONLY exist on this family (e.g. `unrol_len`, `ensemble_size > 1`,
# `ms_head_*`); do not reuse this file for the CP (AR-TCN) or MS2MS (E2E-TCN / M3) families -- see
# `robotic_3d_env_debug_cp_ar_tcn.yaml`, `robotic_3d_env_debug_ms2ms_e2e_tcn.yaml` and
# `robotic_3d_env_debug_ms2ms_m3.yaml`. `robotic_3d_env_debug.yaml` stays the general,
# model-agnostic quick setup. Math-env twin: `math_env_debug_mtm_pro.yaml`.
#
# Usage:
#   >>> python3 robotic_3d_env_main.py +dev@_global_=robotic_3d_env_debug_mtm_pro
#

defaults:
  # Note: use "... /simulator..." instead of "... simulator..." since dev/*.yaml is called from
  #  config group 'dev' which is on same lvl as config group 'environment'
  - override /simulator@environment: pi_tcn_3x_trajectories # Dev ⚒︎
  # - override /simulator@environment: neurobem_3x_named_trajectories # Dev ⚒︎
  # - override /simulator@environment: husky_adverse_mini_two_dataset # Dev ⚒︎
  # ....MTM-Pro family..............................
  - override /dynamics_model@ms_model: ms2ms2ss_ar_temporal_mixture_pme # ★ Particle MTM-Pro
  # - override /dynamics_model@ms_model: ms2ms2ss_ar_temporal_mixture_sampling_free_pme
  # - override /dynamics_model@ms_model: ms2ms2ss_ar_temporal_mixture_resampled_particle_pme
  # - override /dynamics_model@ms_model: tw_ms2ss_dh_pme # (no `unrol_len` key on this one)
  - _self_

# ....Debug override...............................
# seed: 33333
debug_mode: false

overrides:
  experiment: "DEBUG"

pipeline:
  # RLRP-786: dev/debug overlay -> every training-step diagnostic ON (the experiment / HPO pipelines run `fast`).
  performance_mode: dev
  # replay-buffer (legacy, default) | dataloader (RLRP-824 lazy window path). Both are legal for
  # this family as long as `horizon_len <= history_len` (the MTM-Pro output window is `history_len`).
  data_manager: replay-buffer
  enable_ms_replaybuffer_saving_to_data_dir: false # ★ <--
  force_regenerating_saved_ms_replaybuffer: false # ★ <--

  steps:
    single_step_model_learning: false # <--
    multi_step_model_learning: true
    metric_step: false # <--
    test_rollout_InD: true
    test_rollout_OOD: true
    # The MS->MS forecast eval steps are meaningless for a MS->SS family: keep them OFF.
    test_rollout_openloop_forecast: false
    test_rollout_selffed_forecast: false
  plot:
    show_environment_plot: false

  tensorboard:
    batch_callback_execute_every_n: 10 # Option: <int>, null -> disabled batch callback
    clear_tmp_directory_run_artifact_on_teardown: false

hparam_optimizer:
  sweep_optimizer_dryrun: false

UDER:
  batch_size:
    init_value: 500
    limit: 500
    gamma: 1.07
  uder_num_epochs: 1
  num_epochs_train_model: 2
  final_max_num_epochs_train_model: 2

# training_common:
#   model_lr: 1e-4 # Default 1e-4 ★

# one_dim_transition_model:
#   normalize: false # ⚠️
#   normalize_double_precision: false # ⚠️

ms_model: # <- OVERRIDES (MTM-Pro family keys)
  # model_use_double_precision: false # ⚠️
  ensemble_size: 2 # ★★★ Require ensemble_size > 1 on this family

  # ....Multistep....................................
  history_len: 5
  horizon_len: 3
  unrol_len: 2 # MTM-Pro ONLY (second AR stage unroll length); absent on `tw_ms2ss_dh_pme`

  # .... Model architecture ..........................
  num_layers: 1
  hid_size: 12
  ms_head_num_layers: 1
  # ms_head_dropout: 0.0
