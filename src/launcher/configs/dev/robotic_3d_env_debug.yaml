#
# General, model-agnostic quick dev/debug setup: only keys shared by EVERY `ms_model` family are set
# here. Family-specific quick setups (family-only constructor kwargs, matching pipeline knobs):
#   - MTM-Pro (`unrol_len`, ensemble)          -> dev/robotic_3d_env_debug_mtm_pro.yaml
#   - CP / AR baselines (AR-TCN, `ar_*`)       -> dev/robotic_3d_env_debug_cp_ar_tcn.yaml
#   - MS2MS baselines (asymmetric H < F, RLRP-824) -> dev/robotic_3d_env_debug_ms2ms_e2e_tcn.yaml,
#                                                  dev/robotic_3d_env_debug_ms2ms_m3.yaml
#
# Usage:
#   >>> python3 robotic_3d_env_main.py +dev@_global_=robotic_3d_env_debug
#

defaults:
  # Note: use "... /simulator..." instead of "... simulator..." since dev/math_env_debug.yaml
  #  is called from config group 'dev' which is on same lvl as config group 'environment'
  # - override /simulator@environment: neurobem_1x_trajectories # Dev ⚒︎
  # - override /simulator@environment: neurobem_3x_named_trajectories # Dev ⚒︎
  # - override /simulator@environment: neurobem_12x_named_trajectories # Dev ⚒︎
  # - override /simulator@environment: neurobem_70x_train_trajectories # Dev ⚒︎
  - override /simulator@environment: pi_tcn_3x_trajectories # Dev ⚒︎
  # - override /simulator@environment: husky_adverse_mini_two_dataset # Dev ⚒︎
  # - /simulator@environment: neurobem_quarter_dataset
  # - override /simulator@environment: neurobem_half_dataset # Dev ⚒︎
  - _self_

# ....Debug override...............................
# seed: 33333
debug_mode: false

overrides:
  experiment: "DEBUG"

pipeline:
  # RLRP-786: dev/debug overlay -> every training-step diagnostic ON (the experiment / HPO pipelines run `fast`).
  performance_mode: dev
  enable_ms_replaybuffer_saving_to_data_dir: false # ★ <--
  force_regenerating_saved_ms_replaybuffer: false # ★ <--

  steps:
    single_step_model_learning: false # <--
    multi_step_model_learning: true
    metric_step: false # <--
    test_rollout_InD: true
    test_rollout_OOD: true
  plot:
    show_environment_plot: false
    # figdpi: 100 # matplotlib defaut is dpi=100
    # uncertainty_scaling: 2 # default to 2
    # figsize: [35,18]
    # figsize: [46,24]
    # figsize: [52,27]
    # figsize: [70,36]

  tensorboard:
    batch_callback_execute_every_n: 10 # Option: <int>, null -> disabled batch callback
    clear_tmp_directory_run_artifact_on_teardown: false

hparam_optimizer:
  sweep_optimizer_dryrun: false

# source_replay_buffer:
