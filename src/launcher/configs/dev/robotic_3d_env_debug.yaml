  #   gamma_out: 1.11
  #   out_epoch: 15
  #   out_value: 3840
  batch_size:
    init_value: 500
    # init_value: 200
    # limit: 1000
    # init_value: 200
    limit: 500
    # limit: 200
    gamma: 1.07 # For 200->500 in 20 epoch

  # uder_num_epoch_init_override: 2
  uder_num_epochs: 1
  num_epochs_train_model: 2
  # uder_num_epochs: 2
  # num_epochs_train_model: 20
  # uder_num_epochs: 5
  # num_epochs_train_model: 30
  # uder_num_epochs: 4
  # num_epochs_train_model: 80
  final_max_num_epochs_train_model: 2
  # final_max_num_epochs_train_model: 10

