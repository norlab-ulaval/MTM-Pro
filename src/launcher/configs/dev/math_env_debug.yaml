#
# General, model-agnostic quick dev/debug setup: only keys shared by EVERY `ms_model` family are set
# here. Family-specific quick setups (family-only constructor kwargs, matching pipeline knobs):
#   - MTM-Pro (`unrol_len`, ensemble)          -> dev/math_env_debug_mtm_pro.yaml
#   - CP / AR baselines (AR-TCN, `ar_*`)       -> dev/math_env_debug_cp_ar_tcn.yaml
#   - MS2MS baselines (asymmetric H < F, RLRP-824) -> dev/math_env_debug_ms2ms_e2e_tcn.yaml,
#                                                  dev/math_env_debug_ms2ms_m3.yaml
#
# Usage:
#   >>> python3.8 math_env_main.py +dev@_global_=math_env_debug
#

defaults:
  # Note: use "... /simulator..." instead of "... simulator..." since dev/math_env_debug.yaml
  #  is called from config group 'dev' which is on same lvl as config group 'environment'
  # - override /simulator@environment: linear_debug_system # Dev ⚒︎
  # - override /simulator@environment: linear_spiral_v1_1x_single_initial_condition_noise_free
  - override /simulator@environment: lorenz_v6_5XinitC_low_global_noise # standalone release: the paper Lorenz configuration
  - _self_

# ....Debug override...............................
# seed: 33333
debug_mode: false

overrides:
  experiment: "DEBUG"

pipeline:
  # RLRP-786: dev/debug overlay -> every training-step diagnostic ON (the experiment / HPO pipelines run `fast`).
  performance_mode: dev
  steps:
    single_step_model_learning: false # <--
    multi_step_model_learning: true
    metric_step: false # <--
    test_rollout_InD: true
    test_rollout_OOD: true
  plot:
    show_environment_plot: false
    # figdpi: 100 # matplotlib defaut is dpi=100
    # uncertainty_scaling: 2 # default to 2
    # figsize: [35,18]
    # figsize: [46,24]
    # figsize: [52,27]
    # figsize: [70,36]

  tensorboard:
    # batch_callback_execute_every_n: 10 # Option: <int>, null -> disabled batch callback
    clear_tmp_directory_run_artifact_on_teardown: false


hparam_optimizer:
  sweep_optimizer_dryrun: false

# source_replay_buffer:
