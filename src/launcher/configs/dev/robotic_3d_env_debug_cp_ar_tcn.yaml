#
# Compounded-Prediction (CP) baselines quick dev/debug setup on the robotic 3D env: the
# auto-regressive MS->SS unroll family (AR-TCN `B_tcn_deterministic`, AR-GRU / AR-LSTM / AR-MLP
# siblings). Keys under `ms_model` are the AR-family ones (`ar_*`, `teacher_forcing_*`,
# `kernel_size`, `decoder_*`, list `hid_size`); they do not exist on the MTM-Pro or MS2MS families
# -- see `robotic_3d_env_debug_mtm_pro.yaml`, `robotic_3d_env_debug_ms2ms_e2e_tcn.yaml` and
# `robotic_3d_env_debug_ms2ms_m3.yaml`. `robotic_3d_env_debug.yaml` stays the general,
# model-agnostic quick setup. Math-env twin: `math_env_debug_cp_ar_tcn.yaml`.
#
# Usage:
#   >>> python3 robotic_3d_env_main.py +dev@_global_=robotic_3d_env_debug_cp_ar_tcn
#

defaults:
  # Note: use "... /simulator..." instead of "... simulator..." since dev/*.yaml is called from
  #  config group 'dev' which is on same lvl as config group 'environment'
  - override /simulator@environment: pi_tcn_3x_trajectories # Dev ⚒︎
  # - override /simulator@environment: neurobem_3x_named_trajectories # Dev ⚒︎
  # - override /simulator@environment: husky_adverse_mini_two_dataset # Dev ⚒︎
  # ....CP / AR family..............................
  - override /dynamics_model@ms_model: B_tcn_deterministic # ★ AR-TCN
  # - override /dynamics_model@ms_model: B_tcn_faster_deterministic
  # - override /dynamics_model@ms_model: B_gru_deterministic
  # - override /dynamics_model@ms_model: B_lstm_deterministic
  # - override /dynamics_model@ms_model: B_mlp_ar_deterministic
  - _self_

# ....Debug override...............................
# seed: 33333
debug_mode: false

overrides:
  experiment: "DEBUG"

pipeline:
  # RLRP-786: dev/debug overlay -> every training-step diagnostic ON (the experiment / HPO pipelines run `fast`).
  performance_mode: dev
  # replay-buffer (legacy, default) | dataloader (RLRP-824 lazy window path). Both are legal for
  # this family as long as `horizon_len <= history_len` (AR unroll window == `history_len`).
  data_manager: replay-buffer
  enable_ms_replaybuffer_saving_to_data_dir: false # ★ <--
  force_regenerating_saved_ms_replaybuffer: false # ★ <--

  steps:
    single_step_model_learning: false # <--
    multi_step_model_learning: true
    metric_step: false # <--
    test_rollout_InD: true
    test_rollout_OOD: true
    # The MS->MS forecast eval steps are meaningless for a MS->SS family: keep them OFF.
    test_rollout_openloop_forecast: false
    test_rollout_selffed_forecast: false
  plot:
    show_environment_plot: false

  tensorboard:
    batch_callback_execute_every_n: 10 # Option: <int>, null -> disabled batch callback
    clear_tmp_directory_run_artifact_on_teardown: false

hparam_optimizer:
  sweep_optimizer_dryrun: false

UDER:
  batch_size:
    init_value: 500
    limit: 500
    gamma: 1.07
  uder_num_epochs: 1
  num_epochs_train_model: 2
  final_max_num_epochs_train_model: 2

# training_common:
#   model_lr: 1e-4 # Default 1e-4 ★

# one_dim_transition_model:
#   normalize: false # ⚠️
#   normalize_double_precision: false # ⚠️

ms_model: # <- OVERRIDES (AR / CP family keys)
  # model_use_double_precision: false # ⚠️

  # ....Multistep (AR unroll)........................
  history_len: 5
  horizon_len: 3 # AR unroll len U=3, forecast horizon F=1 at deploy
  # ar_temporal_weights: 0.95
  # ar_temporal_weights_start: 1.02
  # ar_temporal_weights_warmup: 100
  # ar_temporal_weights_ramp_stop: 500
  # ar_unrol_len_probablity_decay_start: 100
  # ar_unrol_len_probablity_decay_stop: 500
  # ar_unrol_len_decay_method: beta # Options: beta, exponential, linear
  # teacher_forcing_decay_start: 100
  # teacher_forcing_decay_stop: 500 # Options: abs stop step (>decay_start) or -1 for always_on
  # teacher_forcing_method: linear # Options: linear, exponential, always_on, always_off

  # .... Model architecture (TCN encoder + decoder) ...
  kernel_size: 3
  num_layers: null # null -> variable hid size layers given by the `hid_size` list
  hid_size: [16, 12]
  decoder_num_layers: 1
  decoder_hid_size: 16
