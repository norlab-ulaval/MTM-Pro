# ====Experiment===================================
algorithm:
  name: 'MS_model'

overrides:
  # experiment: 'default'
  experiment: "base"

# comment: "" # Mute when not used

deploy:
  val_rollout:
    # Rollout performed from validation trajectories
    replay_buffer_ratio: 0.1
    trajectory_length_ratio: 0.35
  target_experiment:
    tutor_and_release: true # <--
    ground_truth_feed_warmup_steps: 100
    compounded_predictions_score: true # Only affect tensorboard callback + ERLL algo deploy stage
  model_runtime:
    next_state_deterministic_selection: true # ⚠️
    next_state_sampling_size: 1 # if next_state is probabilistic
  # RLRP-773: opt-in per-epoch-checkpoint test-time rollouts (requires
  # `training_common.force_checkpoint_interval` set on the training run that produced the
  # `epoch_checkpoints/` tree). Default OFF => legacy single deploy, zero extra cost.
  epoch_checkpoint_rollouts:
    enable: false      # Options: bool. Run test-time rollouts for each epoch checkpoint
    epoch_stride: null # Options: int >= 1 or null => every discovered checkpoint
    epochs: null       # Options: list[int] or null => no explicit subset (last epoch always kept)

  # (Priority) ToDo(RLRP-831): refactor-out >> next bloc ↓↓ to 'src/launcher/configs/global_config.yaml'
  # RLRP-785 (A3): opt-in per-step benchmark instrumentation of the deploy test-time rollout.
  # Default OFF => no benchmark kwargs are forwarded to the rollout, so it stays byte-identical.
  # RLRP-803 item 7.5 -- `enabled: false` is an INTENTIONAL OPT-IN, NOT an oversight: the
  # `deployable_latency` timing pass inserts an explicit per-step `torch.cuda.synchronize()`,
  # so switching it on by default would perturb the runtime (and the async pipelining) of EVERY
  # ordinary deploy run. Enable it only for a run whose purpose IS the measurement.
  benchmark:
    enabled: false                  # Options: bool. Master switch (default OFF -- deliberate opt-in)
    levels: [control_loop_step]     # Options: list of model_call, deployer_step, control_loop_step
    timing_pass: deployable_latency # Options: deployable_latency (headline), device_time
    discard_warmup_steps: 0         # Options: int >= 0. Timer warm-up steps dropped before reduction
    # RLRP-803 (item 1 / gate `V10`): keep the per-step latency population in the artifact so the
    # plotter draws TRUE quartiles and the taint filtering can be evidenced (untainted p95/p99 vs
    # the unfiltered one). Default OFF -- it grows the persisted artifact by one float per step.
    keep_raw_samples: false         # Options: bool. Persist the raw per-step latency population
    max_raw_samples: 10000          # Options: int >= 1. Cap (uniform time-ordered decimation above)

