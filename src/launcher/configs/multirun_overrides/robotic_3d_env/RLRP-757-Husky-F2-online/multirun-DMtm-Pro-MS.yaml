# @package _global_

# /////////////////////////////////////////////////
#
#                        ★
#                    CoRL 2026
#       Configuration for experiment RLRP-757
#                  experiment: UGV
#
# Procedure:
#   1. Select specialized multirun cfg in math_env_main_multirun.yaml
#   2. Execute:
#       $ python3 launcher/robotic_3d_env_main_multirun.py --config-name=multirun-DMtm-Pro-MS --config-dir=launcher/configs/multirun_overrides/robotic_3d_env/RLRP-757-Husky-F2-online
#
#   Override nb of trial by adding: --multirun "trial_nb=range(2)"
#
# For debuging, add: +dev@_global_=math_env_debug
#
# Note:
#   n_jobs is set using HPO_N_JOBS environment variables in slurm script
#
# /////////////////////////////////////////////////

defaults:
  # ....multirun default.............................
  # - /multirun_base
  - /multirun_named_subdir
  # ....experiment main..............................
  - /main_experiments/robotic_3d_env/ICRA2026@_global_: robotic_3d_env_main_exp_RLRP-757_husky-F2c-obsD6-online
  - /dynamics_model@ms_model: ms2ms2ss_ar_temporal_mixture_sampling_free_pme
  - robotic_3d_multirun_MTM_pro_experiment_default_RLRP-757-F2c
  # ....simulation mode..............................
  - override /simulation_mode: single_agent_flatten_headless # alt: single_agent_flatten_human
  # ....pipeline.....................................
  - override /pipeline: robotic_3d_env_full_pipeline_multirun
  - _self_

trial_nb: 1


experiment_variation_dir_name: DMtm-Pro-MS

ms_model:
  history_len: ${A_trj_len.HI}
  horizon_len: ${A_trj_len.HO}
  unrol_len: ${A_trj_len.U}

  # RLRP-830 Item B1 (enabled for the paper runs 2026-09-19, operator decision, RLRP-786 plan
  # Step 1): re-use the per-step ``MixtureSameFamily`` already built in ``_default_forward``
  # for the ``true_mixture`` MS NLL. Narval A100 row (job #3441751, B=512, H/F/U=20/10/10):
  # 124.0 -> 119 ms/step (x1.08), kernels 6 814 -> 6 617. Forward / deploy / loss are
  # bit-identical; the ONLY deviation is a ~1-ulp autograd summation-order difference on the
  # temporal-mixer parameter gradient when an attitude slot is live (documented in the
  # ``dynamics_model`` yaml + ``test_mtm_pro_bit_identical_fast_paths_rlrp830.py``), accepted.
  reuse_step_mixture: true

  single_step_loss:
    enable: false

  compounded_prediction_deploy_loss:
    enable: false

A_trj_len: ???

# ....Multirun sweep...............................
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      trial_nb: range(1,5)

      # A_trj_len: choice({HI:20,HO:20,U:20},{HI:20,HO:1,U:1},{HI:20,HO:5,U:5})
      A_trj_len: choice({HI:20,HO:10,U:10})
      # A_trj_len: choice({HI:10,HO:5,U:5})
      # A_trj_len: choice({HI:30,HO:15,U:15})

      # ms_model.ms_probabilistic_loss_mode: true_mixture,moment_matched
