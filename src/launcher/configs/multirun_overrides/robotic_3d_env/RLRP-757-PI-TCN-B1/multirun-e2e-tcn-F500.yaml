# @package _global_

# /////////////////////////////////////////////////
#
#                        ★
#                    CoRL 2026
#       Configuration for experiment RLRP-757
#            experiment: PI-TCN B1a, ULH F=500
#
# Ultra-long-horizon (RLRP-824) E2E-TCN baseline: asymmetric window H=20 / F=500 on the lazy
# window DataLoader path (`pipeline.data_manager: dataloader`).
#
# Procedure:
#   1. Select specialized multirun cfg in robotic_3d_env_main_multirun.yaml
#   2. Execute:
#       $ python3 launcher/robotic_3d_env_main_multirun.py --config-name=multirun-e2e-tcn-F500 --config-dir=launcher/configs/multirun_overrides/robotic_3d_env/RLRP-757-PI-TCN-B1
#
#   Override nb of trial by adding: --multirun "trial_nb=range(2)"
#
# For debuging, add: +dev@_global_=robotic_3d_env_debug
#
# Note:
#   Joblib (`loky`) launcher via `/multirun_named_subdir`: `HPO_N_JOBS` trials run concurrently in one
#   process tree sharing ONE GPU (operator decision 2026-09-16, option (b): no SLURM job-array mode).
#   The FR15 profile measured `num_workers > 0` as a NO-GO, so daemonic Joblib workers cost nothing
#   here (`WindowDataLoaderDataSource` forces `num_workers: 0` under a daemon anyway). Size
#   `HPO_N_JOBS` to the GPU: the F>=500 rows are GPU-bound (1 trial per GPU, resubmit the sbatch
#   once per GPU); Husky F50 / Lorenz M3 under-utilise a GPU (several trials per GPU).
#   Staged HDF5 store: `RLRC_STAGE_DATA_DIR` (read-only bind) is tried first, see `slurm_jobs/README.md`.
#
# /////////////////////////////////////////////////

defaults:
  # ....multirun default.............................
  # - /multirun_base
  - /multirun_named_subdir
  # - /multirun_base_sequential # one trial at a time per process (no Joblib)
  # ....experiment main..............................
  - /main_experiments/robotic_3d_env/ICRA2026@_global_: robotic_3d_env_main_exp_RLRP-757_pi_tcn_B1a
  - /dynamics_model@ms_model: B_ms2ms_e2e_tcn_deterministic
  # ....simulation mode..............................
  - override /simulation_mode: single_agent_flatten_headless # alt: single_agent_flatten_human
  # ....pipeline.....................................
  - override /pipeline: robotic_3d_env_full_pipeline_multirun
  - _self_

trial_nb: 1

overrides:
  experiment: ${experiment_super}/E2E-TCN-F500

# RLRP-760 S3: compounded SELF-FED (closed-loop) horizon-hopped forecast eval.
# MS->MS only (E2E-TCN / M3 / TBM / MTM-Pro): the collector fail-fasts on any
# non-`AbstractMS2MSForecast` model, so this stays OFF in the shared pipeline cfg.
pipeline:
  # RLRP-824: single-step store (HDF5-cached, (H,F)-independent) + lazy (H, W) window gather.
  # Memory scales with T=358,619 single-step samples (~22 MB fp32), not with F (a materialized
  # H=F=500 buffer is ~22 GB per copy).
  data_manager: dataloader
  steps:
    test_rollout_selffed_forecast: true
  test_rollout_selffed_forecast:
    # F > H (FR14): `plan` is the ONLY supported conditioning on the asymmetric window.
    future_action_conditioning: plan
    # null -> falls back to deploy.target_experiment.ground_truth_feed_warmup_steps (200 in B1a)
    warmup_steps: null

ms_model:

  history_len: ${A_trj_len.HI}
  horizon_len: ${A_trj_len.HO}

  # Setup 1 (ULH): Trainable params: 5,109,898 (ModelTrainer.print_model_summary_once basis) --
  # the operator's 5.1 M robotic-3D budget (2026-09-16: ~equal budget for every model of a dataset).
  # The receptive field 1525 >= H+F=520 needs dilations [1..64] (3 conv blocks more than the
  # [1,2,4,8] main-experiment config), so the width drops 379 -> 279 to stay on budget
  # (`profile_ulh_training_step.py --datasets pi_tcn --model e2e_tcn --fit-hid-size 5100000`).
  # ... End2EndNet body ..........
  num_layers: 3
  hid_size: 279
  kernel_size: 5
  # dilations: [1, 2, 4, 8]  # receptive field 181 < 520: fails the E2E-TCN guard at F=500
  dilations: [1, 2, 4, 8, 16, 32, 64]

  # ... Regularization ..........
  # Note: End2End-TCN exposes a single `dropout` knob (no `ms_head_dropout`).
  dropout: 0.0
  activation_fn_cfg:
    _target_: torch.nn.GELU

  # RLRP-824 FR15 profiling gate, PI-TCN row (Jetson Orin, jetson_clocks on, governor performance,
  # B=512, H20/F500, production lazy path, hid 379): fp32 7965 ms/batch -> autocast(bf16) 2261 ms
  # (3.52x, peak CUDA 7.9 -> 5.1 GB, finite loss) => bf16 is the GO opt-in for E2E-TCN.
  # `cudnn.benchmark` measured neutral (1.00x) on top of bf16 => left at the shipped
  # `torch_backend.cudnn_benchmark: true` (global_config.yaml, single owner applied at app setup).
  # TF32 stays OFF (`torch_backend.cuda_high_precision_float32: true`, matmul precision "highest"):
  # under autocast(bf16) conv/linear run in bf16 regardless of the TF32 switch, so Gate D only keeps
  # the residual fp32 ops (normalizer, loss, norms, GELU) exact -- do NOT read the "highest" log line
  # as "full-precision run": bf16 (8-bit mantissa) is a STRONGER, deliberate concession than TF32.
  # Conservative fp32 fallback (TF32 1.7-1.9x): `mixed_precision: null` +
  # `torch_backend.cuda_high_precision_float32: false`.
  # Budget-width (hid 279) bf16 numbers: see the plan artifact, *batch-size scaling (budget widths)*.
  mixed_precision: bf16

  feature_geometry:
    loss_weight: 1.0
    loss_objective: chordal # Options: geodesic (default), chordal, null (disable)
    auto_weighting: false
  internal_orientation:
    representation: quaternion # Options: quaternion, quaternion_legacy

# RLRP-824 FR15: `num_workers > 0` measured NO-GO as a speed knob (gather 9.6 -> 3.7 ms of
# 7965 ms/batch, 1.00x); workers remain legal on this path for HDF5-lazy stores only.
mbrl_lib:
  dataloader:
    num_workers: 0

A_trj_len: ???

# ....Multirun sweep...............................
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      trial_nb: range(1,5)

      # Asymmetric ULH window: H=20 history, F=500 forecast (W = 500 composed output blocks).
      A_trj_len: choice({HI:20,HO:500})
