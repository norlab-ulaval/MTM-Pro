# @package _global_

# /////////////////////////////////////////////////
#
#                        ★
#                    ICRA 2026
#       Configuration for experiment RLRP-757-E4
#        experiment: Lorenz (full), ULH F=1000
#
# Ultra-long-horizon (RLRP-824) E2E-TCN baseline: asymmetric window H=20 / F=1000 on the lazy
# window DataLoader path (`pipeline.data_manager: dataloader`, in-memory single-step store).
#
# Procedure:
#   1. Select specialized multirun cfg in math_env_main_multirun.yaml
#   2. Execute:
#       $ python3 launcher/math_env_main.py --config-name=math_env_main_multirun_RLRP-757-e2e-tcn-F1000 --config-dir=launcher/configs/multirun_overrides/math_env/RLRP-757-E4b-low-global-noise
#
#   Override nb of trial by adding: --multirun "trial_nb=range(2)"
#
# For debuging, add: +dev@_global_=math_env_debug
#
# Note:
#   Joblib (`loky`) launcher via `/multirun_named_subdir`: `HPO_N_JOBS` trials run concurrently in one
#   process tree sharing ONE GPU (operator decision 2026-09-16, option (b): no SLURM job-array mode).
#   The FR15 profile measured `num_workers > 0` as a NO-GO, so daemonic Joblib workers cost nothing.
#   Size `HPO_N_JOBS` to the GPU: E2E-TCN H20/F1000 is GPU-bound (1 trial per GPU, resubmit the
#   sbatch once per GPU); M3 H1/F1000 (shared, vectorized) can share a GPU. Math env: no HDF5 store.
#
# /////////////////////////////////////////////////

defaults:
  # ....multirun default.............................
  # - /multirun_base
  - /multirun_named_subdir
  # - /multirun_base_sequential # one trial at a time per process (no Joblib)
  # ....experiment main..............................
  - /main_experiments/math_env/ICRA2026@_global_: math_env_main_exp_RLRP-757-E4B-low-global-noise
  - /dynamics_model@ms_model: B_ms2ms_e2e_tcn_deterministic
  # ....simulation mode..............................
  - override /simulation_mode: single_agent_flatten_headless # alt: single_agent_flatten_human
  # ....pipeline.....................................
  - override /pipeline: math_env_full_pipeline_multirun
  - _self_

trial_nb: 1

overrides:
  experiment: ${experiment_super}/E2E-TCN-F1000

# RLRP-760 S3: compounded SELF-FED (closed-loop) horizon-hopped forecast eval.
# MS->MS only (E2E-TCN / M3 / TBM / MTM-Pro): the collector fail-fasts on any
# non-`AbstractMS2MSForecast` model, so this stays OFF in the shared pipeline cfg.
pipeline:
  # RLRP-824: in-memory single-step store built from the generated Lorenz trajectories (model
  # dtype, no float64 host buffer) + lazy (H, W) window gather.
  data_manager: dataloader
  steps:
    test_rollout_selffed_forecast: true
  test_rollout_selffed_forecast:
    # F > H (FR14): `plan` is the ONLY supported conditioning on the asymmetric window.
    future_action_conditioning: plan

ms_model:
  history_len: ${A_trj_len.HI}
  horizon_len: ${A_trj_len.HO}

  # Setup 1 (ULH): Trainable params: 2,205,504 (ModelTrainer.print_model_summary_once basis) --
  # the operator's 2.2 M Lorenz budget (2026-09-16: ~equal budget for every model of a dataset).
  # The first F=1000 campaign ran hid 248 = 5.86 M with the same 10 dilation levels; the width
  # drops 248 -> 152 to land on budget
  # (`profile_ulh_training_step.py --datasets lorenz --model e2e_tcn --fit-hid-size 2200000`).
  # ... End2EndNet body ..........
  num_layers: 3
  hid_size: 152
  kernel_size: 5
  # receptive field 3*4*1023+1 = 12277 >= H+F = 1020
  dilations: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]

  # ... Regularization ..........
  # Note: End2End-TCN exposes a single `dropout` knob (no `ms_head_dropout`).
  dropout: 0.0
  activation_fn_cfg:
    _target_: torch.nn.GELU

  # RLRP-824 FR15 profiling gate, Lorenz row (Jetson Orin, jetson_clocks on, governor performance,
  # B=300, H20/F1000, production lazy path, hid 248): fp32 6601 ms/batch -> autocast(bf16) 2690 ms
  # (2.45x, peak CUDA 7.6 -> 4.5 GB, finite loss); the legacy H=F=1000 shape measured 10218 ms
  # => H=20 + bf16 = 3.8x per batch vs the first F=1000 campaign. `cudnn.benchmark` neutral (1.00x)
  # => left at the shipped `torch_backend.cudnn_benchmark: true` (single owner, applied at app setup).
  # TF32 stays OFF (`torch_backend.cuda_high_precision_float32: true`, matmul precision "highest"):
  # under autocast(bf16) conv/linear run in bf16 regardless of the TF32 switch, so Gate D only keeps
  # the residual fp32 ops (normalizer, loss, norms, GELU) exact -- do NOT read the "highest" log line
  # as "full-precision run": bf16 (8-bit mantissa) is a STRONGER, deliberate concession than TF32.
  # Conservative fp32 fallback (TF32 1.7-1.9x): `mixed_precision: null` +
  # `torch_backend.cuda_high_precision_float32: false`.
  # Budget-width (hid 152) bf16 numbers: see the plan artifact, *batch-size scaling (budget widths)*.
  mixed_precision: bf16

# RLRP-824 FR15: `num_workers > 0` measured NO-GO as a speed knob (gather 6.0 -> 1.6 ms of
# 6601 ms/batch, 1.00x).
mbrl_lib:
  dataloader:
    num_workers: 0

A_trj_len: ???

# ....Multirun sweep...............................
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      trial_nb: range(1,5)

      # Asymmetric ULH window: H=20 history, F=1000 forecast (W = 1000 composed output blocks).
      # (the first F=1000 campaign had to run {HI:1000,HO:1000}: 2x the conv sequence, 2x memory)
      A_trj_len: choice({HI:20,HO:1000})


