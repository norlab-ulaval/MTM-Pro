# @package _global_

# Set the MTM-Pro sub-config version
# Mute to to discard sub-version
mtm_pro_cfg_version: E4b1 # <--

overrides:
  experiment: ${experiment_super}/${experiment_variation_dir_name}-${oc.select:mtm_pro_cfg_version,"default"}

one_dim_transition_model:
  # normalizer_type: standard
  normalizer_type: standard_symmetric # <--
  # normalizer_type: standard_symmetric_innovation
  # normalizer_kwargs:
  #   # ....RLRP-761 S4 -- `standard_symmetric_innovation` only.......
  #   innovation_scale_mode: one_step_delta
  #   # one_step_delta -> s = std(x[t+1] - x[t])                 (default)
  #   # noise_floor    -> s = 1.4826 * MAD(2nd diff) / sqrt(6)   the IRREDUCIBLE
  #   #                   high-frequency floor; a rare adverse excursion stays a
  #   #                   large multiple of it instead of raising its own bar.
  #   # explicit       -> use the `innovation_scale` vector below.

# ====Feature loss-weight policy (RLRP-761 S7 / S10)=====
# The SINGLE home of the per-feature loss-weight policy: the criterion, the
# semantic and the three bounds. It is deliberately NOT part of `ms_model`:
# this is a training-OBJECTIVE policy, resolved from the dataset at the
# training-start seam long after the model exists, and the model only ever
# receives the already-resolved numeric vectors. Separation of concerns.
#
# Budget share of a feature = `w_d * sigma_delta_TARGET_d ** 2`, renormalized.
#
# MIGRATION: `ms_model.obs_feature_weights` / `act_feature_weights` /
#   `feature_weight_mode` / `feature_weight_max_ratio` are DEPRECATED aliases of
#   the keys below; they still work and emit a DeprecationWarning naming the
#   replacement.
feature_loss_weights:
  # ....The criterion..............................................................
  # A named criterion, a scalar, or an explicit per-dim list.
  #   predictability   -> w ~ (sigma_delta / sigma_noise_floor)**2. RECOMMENDED:
  #                       de-emphasises NOMINAL vibration while keeping the rare
  #                       adverse excursions fully salient.
  #   state_equivalent -> w ~ sigma_state**2. The raw-space CONTROL: it makes a
  #                       symmetric target reproduce the per-feature budget the
  #                       raw-target `standard` path implicitly uses.
  #   raw_equivalent   -> w ~ sigma_delta**2, i.e. innovation energy. NOTE
  #                       (RLRP-761 S8.4f) this is NOT the raw-space control it was
  #                       once documented to be -- that needs sigma_state**2.
  #   uniform          -> the scalar 1.0 (explicit opt-out, weighting path OFF).
  obs_feature_weights: uniform # --> disable feature weighting
  # obs_feature_weights: predictability
  # obs_feature_weights: state_equivalent
  # An UNSET act block inherits the obs criterion (S7.3): the two are concatenated
  # and normalized jointly, so leaving it at 1.0 is NOT neutral. `uniform` opts out.
  act_feature_weights: null
  # ....The semantic...............................................................
  # `multiplicative` -> `w_d * NLL_d`, which actually re-allocates the gradient.
  # `tempered`       -> `NLL_d + log w_d`, an ADDITIVE CONSTANT on an NLL, hence
  #                     GRADIENT-INERT (blocker B1). Pairing it with a named
  #                     criterion is REFUSED, since it yields a null result that
  #                     looks like a measurement.
  feature_weight_mode: multiplicative
  # ....The three bounds -- three DIFFERENT quantities.............................
  # Lower bound on a resolved weight, in units of the MEAN weight. The named
  # criteria are quadratic in a measured scale, so without a floor a low-innovation
  # channel collapses by ~2 orders of magnitude. On the reference UGV run this
  # left `angular_vels.x/y` at w=0.04/0.05 -- i.e. the adverse-event channels
  # (traction loss, weight transfer) effectively unsupervised. `0.0` disables it.
  feature_weight_min: 0.15 # <--
  # Target weight of the EXOGENOUS `dt` (delta-timestamp) dim. `dt` is read from
  # the clock at deploy time and the deploy path emits observations only, so
  # forecasting it buys nothing; standardizing it (S1.5) correctly fixed the
  # model's INPUT blindness but also promoted pure clock jitter into the target,
  # where it took 52.4 % of the budget. `1.0` restores the S1.5-era behaviour.
  # dt_target_weight: 1.0 # <--
  # Maximum share of the composed target budget a single feature may hold. This
  # is the bound that MATTERS, and the three bounds are NOT interchangeable:
  # `feature_weight_min` bounds the WEIGHT, `max_weight_ratio` the weight RATIO,
  # and only this one bounds the realized BUDGET -- which is quadratic in the
  # normalized one-step innovation, hence a 94x weight spread produced a ~200x
  # budget spread, and even after `feature_weight_min` one feature still held
  # 59 %. Enforced by water-filling across the obs AND act blocks jointly.
  # `1.0` disables it.
  max_target_share: 0.35 # <--
  # Upper bound on the RATIO of the resolved weights (`max_d w_d / min_d w_d`),
  # applied as a symmetric log-space squash BEFORE the model's own sum
  # normalization (only ratios survive it, so an absolute clip is meaningless).
  # `null` -> framework default.
  max_weight_ratio: 0.40


ms_model:

  model_use_double_precision: false # <-- # ⚠️
  ensemble_size: 1 # ⚠️ For first paper
  distribution_name: laplace

  learn_logvar_bounds: true
  logvar_bound_grad_clip: null

  activation_fn_cfg:
    # _target_: torch.nn.Mish
    _target_: torch.nn.GELU

  enable_auto_loss_weighting: true
  auto_weighting_noise_model: gaussian
  auto_weighting_scheme: tempered_likelihood

  # Horizon reduction of the per-step NLLs (only effective for probabilistic losses):
  #   independent     -> SUM of per-step NLLs, assuming independent steps p(X,Y)=p(X)p(Y) (default);
  #   prob-sum        -> -logsumexp_j(-nll_j) = -log(sum_j p_j), NLL of prob-space sum p(X)+p(Y)
  #                      (NOT inter-step dependence; formerly 'dependent', RLRP-704);
  #   soft-max-energy -> logsumexp_j(E_j) = log Z, Gibbs free energy / log-partition of the per-step
  #                      energies E_j=nll_j at beta=1 (~= max_j nll_j; energy-function, not a joint NLL);
  #   energy-density  -> (1/beta) * logsumexp_j(beta * E_j), temperature-controlled energy density /
  #                      log-partition (free energy) of the Gibbs distribution over horizon steps.
  ms_probabilities_reduction: independent
  # `ms_temporal_weighting_mode` (RLRP-769): HOW the temporal discount w_j=gamma^j enters the
  # per-step NLL + the matching horizon scale. Options:
  #   log-shift    -> nll_j + log w_j (legacy, former default; gamma gradient-inert, magnitude ~ horizon_len)
  #   tempered     -> w_j*nll_j, sum_j w_j=1 (convex combo; gamma effective; horizon-scale invariant)
  #   discounted-sum -> gamma^j*nll_j (raw EMA, w_0=1; gamma effective; magnitude ~ 1/(1-gamma)) [DEFAULT]
  #   joint        -> sum_j nll_j (exact independent joint NLL; undiscounted)
  #   uniform-mean -> (1/horizon_len) sum_j nll_j (discount ablated; scale fixed)
  ms_temporal_weighting_mode: discounted-sum
  temporal_weights: 0.933 # <--

  # ms_probabilistic_loss_mode: moment_matched # Options: moment_matched, true_mixture
  ms_probabilistic_loss_mode: true_mixture # Options: moment_matched, true_mixture

  history_len: 20
  horizon_len: 10
  unrol_len: 10

  # Per-region layer-bloc selector (RLRP-768; superset of `residual_form`).
  #   null (default) -> per-region defaults: encoder/hidden -> residual_v2; every
  #     other region (decoder, ms_head, ss_head, mixture, projection,
  #     probabilistic_head) -> dense.
  #   Override per region with a mapping, e.g.:
  #     layer_bloc
  #       encoder: {type: gated_mlp, layer_norm: true, dropout: null}
  #       ms_head: {type: dense,      layer_norm: false}   # LayerNorm/gated FORBIDDEN here
  #   type in {residual_v2, residual_legacy, dense, gated_mlp}; gated_mlp
  #   layer_norm are legal ONLY in encoder/hidden. `residual_form` above stays a
  #   working alias (it only re-selects the residual VARIANT of encoder/hidden).
  layer_bloc:
    encoder:
      type: residual_v2 # <--
      layer_norm: false
      dropout: null
    ms_head:
      type: dense # <--

  # # Setup 4: # Trainable params: 2.2 M (with gated_mlp + mix->input_and_index_dependent 1Lx312)
  # # ... Encoder ..........
  # num_layers: 3
  # hid_size: 329
  # # ... Decoder ..........
  # ms_head_num_layers: 3

  # # Setup 5: # Trainable params: 2.2 M (with E&D->residual_v2 + mix->input_and_index_dependent 2Lx256)
  # # ... Encoder ..........
  # num_layers: 3
  # hid_size: 362
  # # ... Decoder ..........
  # ms_head_num_layers: 3

  # # Setup 6: # Trainable params: 2.2 M (with E->residual_v2 D-> dense + mix->input_and_index_dependent 1Lx312)
  # # ... Encoder ..........
  # num_layers: 3
  # hid_size: 422
  # # ... Decoder ..........
  # ms_head_num_layers: 3

  # Setup 7: # Trainable params: 2.2 M (with E->residual_v2 D-> dense + mix->index)
  # ... Encoder ..........
  num_layers: 3
  hid_size: 456
  # ... Decoder ..........
  ms_head_num_layers: 3

  ms_head_dropout: 0.0

  single_step_loss:
    enable: false
    loss_weight: 1e+1
    auto_weighting: true

  info_projection_loss:
    enable: false

  siw_mp_loss:
    enable: false

  gms_iwae_loss:
    enable: false

  deploy_head:
    mode: forecast # Options: forecast, projection

  rollout_consistency_loss:
    enable: false

  temporal_mixture_weights:
    kind: index
    # kind: input_and_index_dependent
    # kind: additive_index_input_and_history_dependent
    # head_size: 256 # ★★ HPO
    # num_layers: 2 # ★★ HPO
    # dropout: 0.19 # ★★★ HPO
    head_size: 1
    num_layers: 1
    dropout: 0.0

  forecast_teacher_forcing:
    # method: exponential # Options: linear, exponential, always_on, always_off
    method: always_off # Options: linear, exponential, always_on, always_off
    # decay_start: 200
    # decay_stop: 6000

  compounded_prediction_deploy_loss:
    enable: false
    loss_weight: 87.0 # ★★★★ HPO Jul 24 2026
    auto_weighting: true # route CP through the composite auto-weighting ("CP" slot)
    horizon_len: null
    # ... Deploy-history drift residual sub-term (DH; RLRP-731) ..................................
    enable_history_drift_loss: false # <--
    # history_drift_loss_weight: 60.0 # ★★★ HPO
    history_drift_loss_weight: 1.0
    history_drift_auto_weighting: true  # route DH through the composite auto-weighting ("DH" slot)
    history_drift_target_mode: raw_passthrough # Options: inline_denorm, raw_passthrough (RLRP-731 B4-raw, implemented)
    # .............................................................................................
    # Second-AR-stage schedulers / teacher-forcing / temporal-discount (formerly flat ar_* /
    # teacher_forcing_* kwargs, now grouped here). Mirrors B_gru_probabilistic.yaml 20-33.
    ar_temporal_weights: 0.933 # <--
    ar_temporal_weights_start: 1.0
    ar_temporal_weights_warmup: 0
    ar_temporal_weights_ramp_stop: 0 # 0->Disabled
    ar_unrol_len_probablity_decay_start: 1000
    # ar_unrol_len_probablity_decay_stop: 12000 # 0->Disabled
    ar_unrol_len_probablity_decay_stop: 0 # 0->Disabled
    ar_unrol_len_decay_method: beta # Options: beta, exponential, linear
    ar_unrol_len_start_horizon_len: 1  # Short unroll length the curriculum grows from
    teacher_forcing_decay_start: 0 # warmup phase
    teacher_forcing_decay_stop: 6000 # Options: abs stop step (>decay_start), 0->Disabled, -1->always_on
    teacher_forcing_method: always_off # Options: linear, exponential, always_on, always_off


  train_time_domain_randomization:
    enable: false

