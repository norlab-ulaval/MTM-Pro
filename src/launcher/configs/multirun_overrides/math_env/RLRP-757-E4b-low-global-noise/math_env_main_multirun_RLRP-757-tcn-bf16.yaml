# @package _global_

# /////////////////////////////////////////////////
#
#                        ★
#                    CoRL 2026
#       Configuration for experiment RLRP-757
#   experiment: Lorenz (E4b, low global noise), AR-TCN SOTA baseline -- bf16 MIXED PRECISION (eager)
#
# The `math_env_main_multirun_RLRP-757-tcn.yaml` experiment cfg, verbatim (same `B_tcn_deterministic` model, widths, B, budget, data path),
# in bf16 MIXED PRECISION: `torch.autocast(bfloat16)` around the forward + loss of `training_step` /
# `validation_step`, fp32 masters / optimizer state / backward (`ms_model.mixed_precision`, RLRP-824 FR9;
# attached post-construction by `setup.py` since the AR family takes no such ctor kwarg). TF32 stays OFF
# (`torch_backend.cuda_high_precision_float32: true`). This is the SOTA baseline's own throughput lever
# (A100 UAV B=512: 329.9 -> 57.3 ms/step eager) and a DIFFERENT numerical regime: its loss trajectory is
# NOT comparable with the fp32 "highest" series (paper accuracy rows stay fp32).
#
# Procedure:
#   $ python3 launcher/math_env_main.py --config-name=math_env_main_multirun_RLRP-757-tcn-bf16 --config-dir=launcher/configs/multirun_overrides/math_env/RLRP-757-E4b-low-global-noise
#
#   Override nb of trial by adding: --multirun "trial_nb=range(2)"
#
# For debuging, add: +dev@_global_=math_env_debug (sets `performance_mode: dev` back -> eager step)
#
# Note:
#   n_jobs is set using HPO_N_JOBS environment variables in slurm script
#
# /////////////////////////////////////////////////

defaults:
  # ....the experiment cfg, verbatim (model, widths, B, budget, data path)....
  - math_env_main_multirun_RLRP-757-tcn
  - _self_

overrides:
  experiment: ${experiment_super}/TCN-bf16

ms_model:
  # RLRP-824 FR9 autocast knob: null | bf16 | fp16 (fp16 = CUDA only, no GradScaler). Read by
  # `mbrl.models.Model.resolve_autocast_dtype()` on the constructed model.
  mixed_precision: bf16


A_trj_len: ???

# ....Multirun sweep...............................
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      trial_nb: range(1,5)

      # A_trj_len: choice({HI:20,HO:20},{HI:20,HO:1},{HI:20,HO:5})
      A_trj_len: choice({HI:20,HO:10})


