# @package _global_

# /////////////////////////////////////////////////
#
#                        ★
#                    ICRA 2026
#       Configuration for experiment RLRP-757-E4
#        experiment: Lorenz (full), ULH F=1000
#
# Ultra-long-horizon (RLRP-824) M3 baseline: asymmetric window H=1 / F=1000 on the lazy window
# DataLoader path (`pipeline.data_manager: dataloader`), shared-net realisation.
#
# Procedure:
#   1. Select specialized multirun cfg in math_env_main_multirun.yaml
#   2. Execute:
#       $ python3 launcher/math_env_main.py --config-name=math_env_main_multirun_RLRP-757-m3-F1000 --config-dir=launcher/configs/multirun_overrides/math_env/RLRP-757-E4b-low-global-noise
#
#   Override nb of trial by adding: --multirun "trial_nb=range(2)"
#
# For debuging, add: +dev@_global_=math_env_debug
#
# Note:
#   Joblib (`loky`) launcher via `/multirun_named_subdir`: `HPO_N_JOBS` trials run concurrently in one
#   process tree sharing ONE GPU (operator decision 2026-09-16, option (b): no SLURM job-array mode).
#   The FR15 profile measured `num_workers > 0` as a NO-GO, so daemonic Joblib workers cost nothing.
#   Size `HPO_N_JOBS` to the GPU: E2E-TCN H20/F1000 is GPU-bound (1 trial per GPU, resubmit the
#   sbatch once per GPU); M3 H1/F1000 (shared, vectorized) can share a GPU. Math env: no HDF5 store.
#
# /////////////////////////////////////////////////

defaults:
  # ....multirun default.............................
  # - /multirun_base
  - /multirun_named_subdir
  # - /multirun_base_sequential # one trial at a time per process (no Joblib)
  # ....experiment main..............................
  - /main_experiments/math_env/ICRA2026@_global_: math_env_main_exp_RLRP-757-E4B-low-global-noise
  - /dynamics_model@ms_model: B_ms2ms_m3_deterministic
  # ....simulation mode..............................
  - override /simulation_mode: single_agent_flatten_headless # alt: single_agent_flatten_human
  # ....pipeline.....................................
  - override /pipeline: math_env_full_pipeline_multirun
  - _self_

trial_nb: 1

overrides:
  experiment: ${experiment_super}/M3-F1000

# RLRP-760 S3: compounded SELF-FED (closed-loop) horizon-hopped forecast eval.
# MS->MS only (E2E-TCN / M3 / TBM / MTM-Pro): the collector fail-fasts on any
# non-`AbstractMS2MSForecast` model, so this stays OFF in the shared pipeline cfg.
pipeline:
  # RLRP-824: in-memory single-step store built from the generated Lorenz trajectories (model
  # dtype, no float64 host buffer) + lazy (H, W) window gather.
  data_manager: dataloader
  steps:
    test_rollout_selffed_forecast: true
  test_rollout_selffed_forecast:
    # F > H (FR14): `plan` is the ONLY supported conditioning on the asymmetric window.
    future_action_conditioning: plan

ms_model:
  history_len: ${A_trj_len.HI}
  horizon_len: ${A_trj_len.HO}

  # Setup 1 (ULH): Trainable params: 2,202,577 (ModelTrainer.print_model_summary_once basis) --
  # the operator's 2.2 M Lorenz budget (2026-09-16: ~equal budget for every model of a dataset,
  # hence the two M3 realisations use DIFFERENT widths: shared 1063 here vs literal 462).
  # (`profile_ulh_training_step.py --datasets lorenz --model m3 --fit-hid-size 2200000`)
  #
  # per_horizon_heads: true (literal {T_j}, hid 462) is what the first F=1000 campaign ran:
  # 679.6 M params, 2.7 GB weights, 13.5 GB peak CUDA, +520 ms Adam per step and the
  # `[Errno 122] Disk quota exceeded` on the epoch checkpoints (artifact/slurm_jobs_logs/).
  # ... Horizon-indexed MLP ..........
  per_horizon_heads: false
  num_layers: 3
  hid_size: 1063

  # ... MS head ..........
  ms_head_num_layers: 2

  # RLRP-824 FR15 profiling gate, Lorenz row (Jetson Orin, jetson_clocks on, governor performance,
  # B=300, H1/F1000, production lazy path): the per-horizon Python LOOP dominates every dataset
  # row (~4.7 ms per horizon step: shared hid 462 4681 ms/batch, shared hid 2052 5491 ms/batch,
  # literal 5300 ms/batch) => GO for the batched family evaluation (allclose to the loop).
  vectorized_family_forward: true
  # AMP was a NO-GO on the dispatch-bound LOOP (bf16 0.86x) but is the GO knob on the vectorized
  # forward (`--knobs m3-vectorized`, Lorenz row, B=300, hid 2052): loop fp32 5481 ms -> vectorized
  # fp32 4410 ms (1.24x) -> tf32 2289 ms (2.39x) -> bf16 2122 ms (2.58x), finite loss.
  # Budget-width (hid 1063) bf16 numbers: see the plan artifact, *batch-size scaling (budget widths)*.
  mixed_precision: bf16

  # ... Regularization ..........
  dropout: 0.0
  activation_fn_cfg:
    _target_: torch.nn.GELU

# RLRP-824 FR15: `num_workers > 0` measured NO-GO as a speed knob (gather 12.1 -> 3.9 ms of
# 4681 ms/batch, 1.00x).
mbrl_lib:
  dataloader:
    num_workers: 0

A_trj_len: ???

# ....Multirun sweep...............................
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      trial_nb: range(1,5)

      # Asymmetric ULH window: H=1 (the paper's single Markov state o_t), F=1000 forecast.
      A_trj_len: choice({HI:1,HO:1000})


